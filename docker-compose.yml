services:
  rangkai:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8787}:8787"
    environment:
      - NODE_ENV=production
      - PORT=8787
      - RATE_LIMIT_PER_MIN=${RATE_LIMIT_PER_MIN:-30}
      - AI_PROVIDER_NAME=${AI_PROVIDER_NAME:-Hermes · 9Router (VPS 3)}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-45000}
    restart: unless-stopped
