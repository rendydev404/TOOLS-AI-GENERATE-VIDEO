name: Build & Deploy StudioFlow (GHCR to VPS 3)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-studioflow-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Smoke Test & Push GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve lowercase GHCR image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for CI smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: studioflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test StudioFlow container (/api/health & /)
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8787:8787 studioflow:ci
          CODE=000
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8787/api/health || true)
            echo "health -> HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 1
          done
          [ "$CODE" = "200" ] || { docker logs smoke; exit 1; }
          UI_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8787/)
          echo "/ -> HTTP $UI_CODE"
          [ "$UI_CODE" = "200" ] || { docker logs smoke; exit 1; }
          docker rm -f smoke

      - name: Push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull & Restart on VPS 3
    needs: build
    if: github.repository == 'rendydev404/TOOLS-AI-GENERATE-VIDEO'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Redeploy StudioFlow on VPS 3 via restricted SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ]; then
            echo "::notice::Secrets VPS_DEPLOY_KEY / VPS_HOST belum diatur."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Key dibatasi di VPS 3 khusus untuk /opt/studioflow/redeploy.sh (3x retry tahan jeda jaringan)
          for attempt in 1 2 3; do
            if ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -i ~/.ssh/id_ed25519 "root@$SSH_HOST" true; then
              exit 0
            fi
            echo "SSH attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          exit 1
